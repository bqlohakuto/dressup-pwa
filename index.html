<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#f4f1f3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Dress Atelier" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Dress Atelier v0.2</title>
  <style>
    :root{--accent:#e95c88;--ink:#2e2a2d;--muted:#837b80;--panel:rgba(255,255,255,.88);--line:rgba(66,55,61,.12);--zoom:1;--tx:0px;--ty:0px;--tint:#fff1e7}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#ebe7e9;color:var(--ink);overflow:hidden}
    button{font:inherit;color:inherit}
    .app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;background:linear-gradient(180deg,#f7f4f5 0%,#e9e5e7 100%)}
    header{height:62px;padding:10px 12px 6px;display:flex;align-items:center;gap:8px;z-index:20}
    .brand{font-weight:800;font-size:18px;letter-spacing:.02em;flex:1}.brand small{display:block;font-size:10px;color:var(--muted);font-weight:600;margin-top:1px}
    .iconbtn{width:42px;height:42px;border:1px solid var(--line);background:var(--panel);border-radius:14px;display:grid;place-items:center;box-shadow:0 6px 20px rgba(40,30,35,.08)}
    main{position:relative;min-height:0;overflow:hidden}
    .stage{position:absolute;inset:0 0 188px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 36%,#fff 0,#eee9eb 43%,#d9d4d7 100%)}
    .stage:after{content:"";position:absolute;left:16%;right:16%;bottom:5%;height:6%;border-radius:50%;background:rgba(40,30,35,.13);filter:blur(15px)}
    .model-wrap{height:98%;width:min(78vw,520px);position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:center;touch-action:none;transform:translate(var(--tx),var(--ty)) scale(var(--zoom));transform-origin:center 76%;transition:transform .12s ease}
    .model-img{height:100%;max-width:100%;object-fit:contain;object-position:center bottom;filter:saturate(.98) contrast(1.01) var(--modelFx,none);user-select:none;pointer-events:none;mix-blend-mode:multiply;transition:filter .22s ease}
    .tint{display:none}
    .garment-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;mix-blend-mode:multiply;filter:drop-shadow(0 1px 1px rgba(0,0,0,.08));transition:opacity .18s ease;color:#eee}
    .garment-layer.acc,.garment-layer.bag{mix-blend-mode:normal}
    .tag{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.78);backdrop-filter:blur(14px);border:1px solid var(--line);padding:7px 11px;border-radius:999px;font-size:12px;font-weight:700;z-index:3}
    .float-left,.float-right{position:absolute;top:18px;z-index:4;display:flex;flex-direction:column;gap:8px}.float-left{left:10px}.float-right{right:10px}
    .pill{border:1px solid var(--line);background:rgba(255,255,255,.82);backdrop-filter:blur(12px);border-radius:15px;padding:8px;box-shadow:0 7px 20px rgba(40,30,35,.07)}
    .models{display:flex;gap:6px}.modelchip{width:48px;border:0;padding:0;background:none;position:relative}.modelchip img{width:48px;height:58px;border-radius:12px;object-fit:cover;border:2px solid transparent}.modelchip.active img{border-color:var(--accent);box-shadow:0 0 0 3px rgba(233,92,136,.14)}.modelchip span{display:block;font-size:9px;font-weight:700;margin-top:1px}
    .control{width:48px;height:48px;border:0;background:rgba(255,255,255,.86);border-radius:15px;font-size:20px;box-shadow:0 5px 16px rgba(0,0,0,.07)}.control small{display:block;font-size:8px;margin-top:1px;color:var(--muted)}
    .control.active{background:#fff0f5;color:var(--accent);outline:2px solid rgba(233,92,136,.35)}
    .wardrobe{position:absolute;left:0;right:0;bottom:0;height:196px;background:rgba(251,249,250,.96);backdrop-filter:blur(20px);border-radius:24px 24px 0 0;border-top:1px solid rgba(255,255,255,.7);box-shadow:0 -12px 32px rgba(44,34,39,.13);z-index:10;padding:8px 10px 10px}
    .cats{display:flex;gap:5px;overflow-x:auto;padding:1px 0 7px;scrollbar-width:none}.cats::-webkit-scrollbar,.items::-webkit-scrollbar{display:none}.cat{flex:0 0 58px;border:0;background:transparent;border-radius:12px;padding:5px 3px;font-size:10px;color:#5f565b}.cat b{display:block;font-size:21px;line-height:23px;font-weight:500}.cat.active{background:#fff0f5;color:var(--accent);font-weight:700}
    .items{display:flex;gap:8px;overflow-x:auto;padding:0 1px 7px;scrollbar-width:none}.item{position:relative;flex:0 0 79px;height:68px;border:1px solid var(--line);border-radius:13px;background:#f3f0f2;overflow:hidden;padding:0}.item.active{border:2px solid var(--accent);background:#fff6f9}.item .swatchart{height:47px;margin:5px;border-radius:9px;background:linear-gradient(145deg,var(--itemc,#eee),#fff 56%,var(--itemc,#ddd));box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}.item span{position:absolute;left:5px;right:5px;bottom:3px;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .custom{display:flex;align-items:center;gap:8px;padding:0 2px}.label{font-size:11px;font-weight:800;margin-right:2px}.colors{display:flex;gap:6px}.color{width:25px;height:25px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px rgba(0,0,0,.14)}.color.active{box-shadow:0 0 0 2px var(--accent)}.material{margin-left:auto;border:1px solid var(--line);background:white;border-radius:11px;padding:6px 9px;font-size:10px;font-weight:700}
    nav{height:64px;background:rgba(255,255,255,.96);display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);padding-bottom:max(4px,env(safe-area-inset-bottom));z-index:22}.navbtn{border:0;background:transparent;font-size:9px;color:#6f666b;padding:6px 2px}.navbtn b{display:block;font-size:21px;font-weight:500;line-height:24px}.navbtn.active{color:var(--accent);font-weight:800}
    .drawer{position:absolute;inset:auto 10px 204px 10px;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:20px;padding:12px;z-index:14;box-shadow:0 16px 50px rgba(40,30,35,.18);display:none}.drawer.show{display:block}.drawer h3{margin:0 0 8px;font-size:14px}.posegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pose{border:1px solid var(--line);background:#f7f5f6;border-radius:13px;padding:9px 6px;font-size:11px}.pose.active{border-color:var(--accent);background:#fff1f6;color:var(--accent);font-weight:700}
    .toast{position:absolute;left:50%;bottom:210px;transform:translateX(-50%) translateY(10px);background:rgba(40,34,37,.9);color:white;padding:9px 13px;border-radius:999px;font-size:11px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .shooting header,.shooting .wardrobe,.shooting nav,.shooting .float-left,.shooting .float-right,.shooting .tag{opacity:0;pointer-events:none}.shooting .stage{inset:0}.shooting .model-wrap{height:100%}.shooting .exitshot{display:block}
    .exitshot{display:none;position:fixed;top:14px;right:14px;z-index:100;border:0;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-radius:999px;padding:10px 14px;font-weight:800}
    .saved{display:flex;gap:8px;overflow-x:auto}.savedcard{flex:0 0 110px;border:1px solid var(--line);border-radius:14px;background:#f8f5f7;padding:8px}.savedcard b{font-size:10px;display:block}.savedcard small{font-size:9px;color:var(--muted)}
    @media (min-width:800px){body{display:grid;place-items:center;background:#d9d4d7}.app{width:430px;height:min(900px,96vh);border-radius:34px;overflow:hidden;box-shadow:0 30px 90px rgba(30,25,28,.25);border:8px solid #181719}.wardrobe{height:210px}.stage{bottom:202px}}
  </style>
</head>
<body>
<div class="app" id="app">
  <button class="exitshot" id="exitshot">編集に戻る</button>
  <header>
    <div class="brand">DRESS ATELIER<small>フォトリアル着せ替え・レイヤー試作 v0.2</small></div>

    <button class="iconbtn" id="shotBtn" aria-label="撮影">📷</button>
    <button class="iconbtn" id="resetBtn" aria-label="リセット">↺</button>

const defaults=()=>({model:0,view:'front',pose:0,cat:'tops',
selected:{tops:1,bottoms:0,dress:null,outer:null,inner:0,shoes:0,bag:null,acc:0},
colors:{tops:0,bottoms:4,dress:2,outer:2,inner:1,shoes:5,bag:5,acc:1},

let state=defaults();
const $=s=>document.querySelector(s);
const app=$('#app'), modelImg=$('#modelImg'), modelWrap=$('#modelWrap'), toast=$('#toast');
function renderModels(){ $('#models').innerHTML=models.map((m,i)=>`<button class="modelchip ${state.model===i?'active':''}" data-model="${i}"><img src="${m.face}"><span>${m.name}</span></button>`).join(''); document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>{state.model=+b.dataset.model;renderAll();flash(`${models[state.model].name} に切り替え`)}); }
function renderCats(){ $('#cats').innerHTML=cats.map(c=>`<button class="cat ${state.cat===c[0]?'active':''}" data-cat="${c[0]}"><b>${c[2]}</b>${c[1]}</button>`).join(''); document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;renderCats();renderItems();renderColors();updateMaterialLabel()}); }
function svgMarkup(cat,i){const back=state.view==='back';const tr=back?'translate(80 0) scale(.89 1)':'';return '<g transform="'+tr+'" fill="currentColor">'+garmentShapes[cat][i]+'</g>'}
function renderLayers(){
  Object.keys(items).forEach(cat=>{
    const el=$('#layer-'+cat),i=state.selected[cat];
    if(i===null||i===undefined){el.innerHTML='';return}
    el.innerHTML=svgMarkup(cat,i);
    el.style.color=palette[state.colors[cat]??0];
    const m=materialLook[state.mats[cat]??0]; el.style.opacity=m.o; el.style.filter=m.f+' drop-shadow(0 1px 1px rgba(0,0,0,.08))';
  });
  const dressOn=state.selected.dress!==null;
  $('#layer-tops').style.display=dressOn?'none':'';
  $('#layer-bottoms').style.display=dressOn?'none':'';
}
function thumbSvg(cat,i){return '<svg class="thumbsvg" viewBox="250 250 950 2050" style="width:100%;height:47px;color:#c7bcc1"><g fill="currentColor">'+garmentShapes[cat][i]+'</g></svg>'}
function renderItems(){ const arr=items[state.cat]; $('#items').innerHTML=arr.map((n,i)=>'<button class="item '+(state.selected[state.cat]===i?'active':'')+'" data-item="'+i+'">'+thumbSvg(state.cat,i)+'<span>'+n+'</span></button>').join(''); document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{const i=+b.dataset.item;if(state.selected[state.cat]===i&&['dress','outer','bag','acc'].includes(state.cat))state.selected[state.cat]=null;else{state.selected[state.cat]=i;if(state.cat==='tops'||state.cat==='bottoms')state.selected.dress=null}renderItems();renderLayers();updateTag();flash(items[state.cat][i]+(state.selected[state.cat]===null?' を外しました':' を着用'))}); }
function renderColors(){ $('#colors').innerHTML=palette.map((x,i)=>'<button class="color '+(state.colors[state.cat]===i?'active':'')+'" data-color="'+i+'" style="background:'+x+'"></button>').join(''); document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{state.colors[state.cat]=+b.dataset.color;renderColors();renderLayers();flash('カラーを変更')}); }
function updateMaterialLabel(){ $('#materialBtn').textContent='素材：'+materials[state.mats[state.cat]??0] }
function renderPoses(){ $('#poseGrid').innerHTML=poses.map((p,i)=>`<button class="pose ${state.pose===i?'active':''}" data-pose="${i}">${i===0?'│':i===1?'╱':'⌁'}<br>${p}</button>`).join(''); document.querySelectorAll('[data-pose]').forEach(b=>b.onclick=()=>{state.pose=+b.dataset.pose;renderPoses();$('#poseDrawer').classList.remove('show');updateTag();flash(`${poses[state.pose]} に変更`)}); }
function updateModel(){ modelImg.src=state.view==='front'?MODEL_FRONT:MODEL_BACK; document.documentElement.style.setProperty('--modelFx',modelFx[state.model]||'none'); $('#frontBtn').classList.toggle('active',state.view==='front'); $('#backBtn').classList.toggle('active',state.view==='back'); document.documentElement.style.setProperty('--zoom',state.zoom); document.documentElement.style.setProperty('--tx',state.tx+'px'); document.documentElement.style.setProperty('--ty',state.ty+'px'); renderLayers(); }
function updateTag(){ const look=Object.values(state.selected).reduce((a,b)=>a+b,0)%9+1; $('#lookTag').textContent=`${models[state.model].name} · LOOK ${String(look).padStart(2,'0')} · ${poses[state.pose]}`; }
function renderAll(){renderModels();renderCats();renderItems();renderColors();renderPoses();updateModel();updateTag();updateMaterialLabel()}
function flash(t){toast.textContent=t;toast.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>toast.classList.remove('show'),1200)}
$('#poseBtn').onclick=()=>$('#poseDrawer').classList.toggle('show');
$('#frontBtn').onclick=()=>{state.view='front';updateModel();flash('正面')}; $('#backBtn').onclick=()=>{state.view='back';updateModel();flash('背面')};
$('#zoomIn').onclick=()=>{state.zoom=Math.min(1.55,state.zoom+.1);updateModel()}; $('#zoomOut').onclick=()=>{state.zoom=Math.max(.78,state.zoom-.1);updateModel()}; $('#centerBtn').onclick=()=>{state.zoom=1;state.tx=0;state.ty=0;updateModel();flash('全身表示')};
$('#materialBtn').onclick=()=>{state.mats[state.cat]=(state.mats[state.cat]+1)%materials.length;updateMaterialLabel();renderLayers();flash('素材を変更')};
$('#resetBtn').onclick=()=>{state=defaults();renderAll();flash('リセットしました')};
function saveLook(){let saved=JSON.parse(localStorage.getItem('dressSaved')||'[]');saved.unshift({date:new Date().toLocaleString('ja-JP'),state:JSON.parse(JSON.stringify(state))});saved=saved.slice(0,12);localStorage.setItem('dressSaved',JSON.stringify(saved));flash('コーデを保存しました')}
$('#saveBtn').onclick=saveLook;
function shoot(on=true){app.classList.toggle('shooting',on)} $('#shotBtn').onclick=()=>shoot(true); $('#navShot').onclick=()=>shoot(true); $('#exitshot').onclick=()=>shoot(false);
const pointers=new Map(); let dragStart=null; let pinchStart=null;
function pointDistance(){const p=[...pointers.values()]; if(p.length<2)return 0; return Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}
function pointCenter(){const p=[...pointers.values()]; if(p.length<2)return null; return {x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2}}
modelWrap.addEventListener('pointerdown',e=>{
  modelWrap.setPointerCapture(e.pointerId); pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1) dragStart={x:e.clientX,y:e.clientY,tx:state.tx,ty:state.ty};
  if(pointers.size===2){const c=pointCenter();pinchStart={distance:pointDistance(),zoom:state.zoom,cx:c.x,cy:c.y,tx:state.tx,ty:state.ty};dragStart=null}
});
modelWrap.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return; pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size>=2&&pinchStart){const d=pointDistance();const c=pointCenter();state.zoom=Math.max(.78,Math.min(1.55,pinchStart.zoom*(d/pinchStart.distance)));state.tx=pinchStart.tx+(c.x-pinchStart.cx);state.ty=pinchStart.ty+(c.y-pinchStart.cy);updateModel();return}
  if(pointers.size===1&&dragStart){state.tx=dragStart.tx+(e.clientX-dragStart.x);state.ty=dragStart.ty+(e.clientY-dragStart.y);updateModel()}
});
function releasePointer(e){pointers.delete(e.pointerId);pinchStart=null;if(pointers.size===1){const p=[...pointers.values()][0];dragStart={x:p.x,y:p.y,tx:state.tx,ty:state.ty}}else if(pointers.size===0){dragStart=null}}
modelWrap.addEventListener('pointerup',releasePointer); modelWrap.addEventListener('pointercancel',releasePointer);
modelWrap.addEventListener('wheel',e=>{e.preventDefault();state.zoom=Math.max(.78,Math.min(1.55,state.zoom+(e.deltaY<0?.06:-.06)));updateModel()},{passive:false});
let lastTap=0; modelWrap.addEventListener('pointerup',()=>{if(pointers.size)return;const n=Date.now(); if(n-lastTap<300){state.zoom=1;state.tx=0;state.ty=0;updateModel()} lastTap=n});
renderAll();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
